<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 My Daily Schedule & Rewards 🌟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌟 My Daily Schedule 🌟</h1>
            <div class="stars-earned">
                <span class="star-icon">⭐</span>
                <span id="totalStars">0</span> Stars
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <span class="progress-text" id="progressText">0% Complete</span>
        </div>

        <!-- Current Time Display -->
        <div class="time-display">
            <span id="currentTime">--:--</span>
        </div>

        <!-- Schedule Activities -->
        <main class="schedule-container">
            <div class="schedule-grid" id="scheduleGrid">
                <!-- Activities will be generated by JavaScript -->
            </div>
        </main>

        <!-- Reward Celebration -->
        <div class="celebration" id="celebration">
            <div class="celebration-content">
                <h2>🎉 Great Job! 🎉</h2>
                <p>You earned a star!</p>
                <div class="floating-stars" id="floatingStars"></div>
            </div>
        </div>

        <!-- Completed Modal -->
        <div class="modal" id="rewardModal">
            <div class="modal-content">
                <h2>🏆 Reward Unlocked! 🏆</h2>
                <p id="rewardMessage">You completed all tasks!</p>
                <button class="close-btn" onclick="closeModal()">Yay!</button>
            </div>
        </div>

        <footer class="footer">
            <p>Complete your tasks to earn stars! 🌟</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
